app = "sepia"
primary_region = "lhr"

# Scale to zero when idle (free tier friendly). Set to 1 for always-on.
min_machines_running = 0

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop" # scale to zero when idle
auto_start_machines = true

[vm]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
