app = "mcp-memory"
primary_region = "lhr"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop" # scale to zero when idle
auto_start_machines = true
min_machines_running = 0    # 0 = free tier friendly; set 1 for always-on

[vm]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
